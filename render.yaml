# Render Blueprint for Geo-Attend 24/7 Cloud Deployment
# Automatically provisions both the Backend API and Frontend App
version: "1"

services:
  # 1. Backend Flask API + Face Recognition Engine
  - type: web
    name: geo-attend-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python download_weights.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

  # 2. Frontend React Web App
  - type: web
    name: geo-attend-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
